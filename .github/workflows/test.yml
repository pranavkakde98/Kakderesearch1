name: API tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check every script
        run: for f in api/*.js api/_lib/*.js js/*.js; do node --check "$f"; done
      - name: Run the API regression tests
        run: node --test tests/
      - name: Check the HTML for leftover placeholders
        run: |
          ! grep -rn -E 'lorem ipsum|TODO|XXX|localhost:50' --include=*.html . || (echo "placeholder text found" && exit 1)
